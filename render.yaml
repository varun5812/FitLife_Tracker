services:
  - type: static
    name: fitlife-fitness-tracker
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_PUBLIC_GROQ_API_KEY
        sync: false
      - key: EXPO_PUBLIC_GEMINI_API_KEY
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
